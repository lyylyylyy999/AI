[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not database and not live_model'"
markers = [
    "database: 需要隔离的本地测试数据库",
    "live_model: 必须显式开启的付费模型调用",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
explicit_package_bases = true
